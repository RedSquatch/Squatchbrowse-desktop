[package]
name = "squatchbrowse"
version = "1.0.0"
edition = "2024"
description = "A small, privacy-first reading browser: ad blocking, Reader, Unstick, Zap, and Save for video and audio."
authors = ["RedSquatch"]

[dependencies]
adblock = { version = "0.13.3", features = ["content-blocking", "css-validation"] }
anyhow = "1.0.104"
dirs = "7.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tao = "0.37.1"
toml = "1.1.8"
ureq = "3.4.2"
rfd = "0.15"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
wry = { version = "0.57.0", features = ["devtools"] }

[target.'cfg(target_os = "linux")'.dependencies]
gio-sys = "0.18"
glib = "0.18"
glib-sys = "0.18"
gobject-sys = "0.18"
gtk = "0.18"
webkit2gtk = { version = "2.0.2", features = ["v2_38"] }
webkit2gtk-sys = { version = "2.0.2", features = ["v2_38"] }

[target.'cfg(windows)'.dependencies]
# Same versions wry uses, so the COM types line up.
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_System_Com"] }
windows-core = "0.62"

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true

[package.metadata.deb]
name = "squatchbrowse"
maintainer = "RedSquatch"
section = "web"
priority = "optional"
extended-description = """\
SquatchBrowse is a small reading browser. It blocks ads and trackers with \
Brave's adblock engine, strips pages down to the story (Reader), clears \
overlays that lock up a page (Unstick), removes anything you click (Zap), \
and saves video or audio with yt-dlp."""
depends = "libwebkit2gtk-4.1-0, libgtk-3-0, ffmpeg"
assets = [
    ["target/release/squatchbrowse", "usr/bin/", "755"],
    ["packaging/squatchbrowse.desktop", "usr/share/applications/", "644"],
    ["packaging/icon-256.png", "usr/share/icons/hicolor/256x256/apps/squatchbrowse.png", "644"],
    ["packaging/icon-128.png", "usr/share/icons/hicolor/128x128/apps/squatchbrowse.png", "644"],
    ["packaging/icon-64.png", "usr/share/icons/hicolor/64x64/apps/squatchbrowse.png", "644"],
]
